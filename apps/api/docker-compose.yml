name: todo-api

services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://apiuser:apipassword@api-db:5432/apidb
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:4001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      api-db:
        condition: service_healthy
    networks:
      - api-private
      - devnet
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apiuser
      POSTGRES_PASSWORD: apipassword
      POSTGRES_DB: apidb
    volumes:
      - api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiuser -d apidb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - api-private

volumes:
  api_pgdata:

networks:
  api-private:
    internal: true
  devnet:
    external: true
