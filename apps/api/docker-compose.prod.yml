name: todo-api-prod

services:
  api:
    build:
      context: .
      target: prod
    environment:
      DATABASE_URL: postgresql://apiuser:${API_DB_PASSWORD:?Set API_DB_PASSWORD}@api-db:5432/apidb
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:4001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      api-db:
        condition: service_healthy
    networks:
      - api-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apiuser
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
      POSTGRES_DB: apidb
    volumes:
      - api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiuser -d apidb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - api-private
    restart: unless-stopped

volumes:
  api_pgdata:

networks:
  api-private:
    internal: true
