# Deploy this file as the standalone API Docker Compose application in Coolify.
name: todo-api

services:
  api:
    build:
      context: .
      target: prod
    environment:
      DATABASE_URL: postgresql://apiuser:${API_DB_PASSWORD:?Set API_DB_PASSWORD}@api-db:5432/apidb
      # `todo-auth` is the auth service's explicit alias on the external
      # Coolify proxy network declared below.
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://todo-auth:4001}
      # Web calls /api through Caddy, so normal Coolify traffic is same-origin.
      # Set this only if the API will be called directly from a browser origin.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
    expose:
      - "4000"
    networks:
      default:
      coolify:
        aliases:
          - todo-api
    depends_on:
      api-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apiuser
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
      POSTGRES_DB: apidb
    volumes:
      - api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiuser -d apidb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
    restart: unless-stopped

volumes:
  api_pgdata:

networks:
  # Created by the Coolify proxy installation; do not let Compose create it.
  coolify:
    external: true
