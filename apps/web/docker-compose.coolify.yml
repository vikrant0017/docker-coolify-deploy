# Deploy this file as the standalone web Docker Compose application in Coolify.
name: todo-web

services:
  web:
    build:
      context: .
      target: prod
    environment:
      # `todo-api` is the API service's explicit alias on the external
      # Coolify proxy network declared below.
      API_UPSTREAM: ${API_UPSTREAM:-http://todo-api:4000}
    expose:
      - "80"
    networks:
      - coolify
    restart: unless-stopped

networks:
  # Created by the Coolify proxy installation; do not let Compose create it.
  coolify:
    external: true
