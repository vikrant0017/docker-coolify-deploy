# Deploy this file as the standalone auth Docker Compose application in Coolify.
name: todo-auth

services:
  auth:
    build:
      context: .
      target: prod
    environment:
      DATABASE_URL: postgresql://authuser:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}@auth-db:5432/authdb
    expose:
      - "4001"
    networks:
      default:
      coolify:
        aliases:
          - todo-auth
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      POSTGRES_DB: authdb
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
    restart: unless-stopped

volumes:
  auth_pgdata:

networks:
  # Created by the Coolify proxy installation; do not let Compose create it.
  coolify:
    external: true
