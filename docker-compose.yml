# Platform wrapper: starts the three independently defined app stacks.
# This Compose project creates and removes its own shared network automatically.
name: todo-platform

include:
  - path: ./apps/auth/docker-compose.yml
  - path: ./apps/api/docker-compose.yml
  - path: ./apps/web/docker-compose.yml

services:
  auth:
    networks:
      - auth-private
      - devnet
  api:
    networks:
      - api-private
      - devnet
  web:
    networks:
      - devnet

networks:
  devnet:
